name: Experimental GPU compute
on:
  push:
    branches: [experiment/advanced-rendering]
  workflow_dispatch:
jobs:
  shader-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute D3D11 shaders using WARP
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++20 /EHsc /O2 spellcross-remaster-main\tests\test_gpu_postprocess.cpp /Fe:gpu_test.exe
          if errorlevel 1 exit /b 1
          gpu_test.exe
