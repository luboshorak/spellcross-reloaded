name: Fullscreen menu regression
on:
  push:
    branches: [feature/fullscreen-menu]
  pull_request:
    paths:
      - 'spellcross-map-edit-main/source/tactical_zoom.h'
      - 'spellcross-map-edit-main/source/map.cpp'
      - 'spellcross-map-edit-main/source/map.h'
      - 'spellcross-map-edit-main/tests/test_tactical_zoom.cpp'
      - 'spellcross-map-edit-main/source/game_menu_bar.h'
      - 'spellcross-map-edit-main/source/game_controls.h'
      - 'spellcross-map-edit-main/source/game_menu_font.rc'
      - 'spellcross-map-edit-main/data/font.ttf'
      - 'spellcross-map-edit-main/source/main.cpp'
      - 'spellcross-map-edit-main/source/forms/form_level.cpp'
      - 'spellcross-map-edit-main/source/forms/form_mmenu.cpp'
      - 'spellcross-map-edit-main/locales/**'
      - 'spellcross-map-edit-main/tests/test_game_menu_bar.cpp'
      - '.github/workflows/fullscreen-menu.yml'
  workflow_dispatch:
jobs:
  menu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI test dependencies
        run: sudo apt-get update && sudo apt-get install -y libwxgtk3.2-dev xvfb
      - name: Check source and localization regressions
        run: python3 -m unittest discover -s spellcross-map-edit-main/tests -p 'test_*.py'
      - name: Verify tactical zoom geometry and wheel input
        run: |
          c++ -std=c++17 -Wall -Wextra -pedantic \
            spellcross-map-edit-main/tests/test_tactical_zoom.cpp -o /tmp/spellcross-zoom-test
          /tmp/spellcross-zoom-test
      - name: Build and exercise menu across three windows
        run: |
          c++ -std=c++17 -Wall -Wextra -pedantic $(wx-config --cxxflags) \
            spellcross-map-edit-main/tests/test_game_menu_bar.cpp \
            $(wx-config --libs) -o /tmp/spellcross-menu-test
          timeout 30s xvfb-run -a /tmp/spellcross-menu-test
  menu-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download official wxWidgets MSVC x64 libraries
        shell: pwsh
        run: |
          $wxRoot = Join-Path $env:RUNNER_TEMP 'wxwidgets'
          New-Item -ItemType Directory -Path $wxRoot -Force | Out-Null
          foreach ($asset in @('wxWidgets-3.2.8-headers.7z', 'wxMSW-3.2.8_vc14x_x64_Dev.7z', 'wxMSW-3.2.8_vc14x_x64_ReleaseDLL.7z')) {
            $archive = Join-Path $env:RUNNER_TEMP $asset
            Invoke-WebRequest "https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.8/$asset" -OutFile $archive
            & 7z x $archive "-o$wxRoot" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "wxWidgets extraction failed: $asset" }
          }
      - name: Compile and exercise native Windows fullscreen transitions
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $devcmd = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          cmd /c "`"$devcmd`" -arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process') }
          }
          $wxRoot = Join-Path $env:RUNNER_TEMP 'wxwidgets'
          $core = Get-ChildItem $wxRoot -Recurse -Filter wxmsw32u_core.lib | Select-Object -First 1
          $setup = Get-ChildItem $wxRoot -Recurse -Filter setup.h | Where-Object { $_.FullName -match '[\\/]mswu[\\/]wx[\\/]' } | Select-Object -First 1
          $header = Get-ChildItem $wxRoot -Recurse -Filter wx.h | Where-Object { $_.Directory.Name -eq 'wx' } | Select-Object -First 1
          if (!$core -or !$setup -or !$header) { throw 'wxWidgets release headers or libraries missing' }
          $include = $header.Directory.Parent.FullName
          $setupInclude = $setup.Directory.Parent.FullName
          $binary = Join-Path $env:RUNNER_TEMP 'spellcross-menu-test.exe'
          $zoomTest = Join-Path $env:RUNNER_TEMP 'spellcross-zoom-test.exe'
          & cl.exe /nologo /std:c++17 /EHsc /MD spellcross-map-edit-main/tests/test_tactical_zoom.cpp "/Fe:$zoomTest"
          if ($LASTEXITCODE -ne 0) { throw 'Zoom test compilation failed' }
          & $zoomTest
          if ($LASTEXITCODE -ne 0) { throw 'Zoom test failed' }
          $source = Join-Path $PWD 'spellcross-map-edit-main/source'
          foreach ($file in @('main.cpp', 'map.cpp', 'forms/form_level.cpp', 'forms/form_mmenu.cpp')) {
            $object = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName($file) + '.obj')
            & cl.exe /nologo /c /std:c++17 /EHsc /MD /utf-8 /D_UNICODE /DUNICODE /D__WXMSW__ /DWXUSINGDLL /DNOMINMAX /D_HAS_STD_BYTE=0 /D_WINSOCKAPI_ /D__WINDOWS_DS__ /D_CRT_SECURE_NO_WARNINGS "/I$source" "/I$include" "/I$setupInclude" (Join-Path $source $file) "/Fo:$object"
            if ($LASTEXITCODE -ne 0) { throw "Tactical source compilation failed: $file" }
          }
          $fontResource = Join-Path $env:RUNNER_TEMP 'game-menu-font.res'
          Push-Location spellcross-map-edit-main/source
          try {
            & rc.exe /nologo "/fo$fontResource" game_menu_font.rc
            if ($LASTEXITCODE -ne 0) { throw 'Menu font resource compilation failed' }
          } finally {
            Pop-Location
          }
          & cl.exe /nologo /std:c++17 /EHsc /MD /D_UNICODE /DUNICODE /D__WXMSW__ /DWXUSINGDLL "/I$include" "/I$setupInclude" spellcross-map-edit-main/tests/test_game_menu_bar.cpp "/Fe:$binary" /link $fontResource "/LIBPATH:$($core.DirectoryName)" wxmsw32u_core.lib wxbase32u.lib gdi32.lib /SUBSYSTEM:WINDOWS
          if ($LASTEXITCODE -ne 0) { throw 'Fullscreen test compilation failed' }
          Get-ChildItem $wxRoot -Recurse -Filter '*.dll' | Copy-Item -Destination $env:RUNNER_TEMP -Force
          $process = Start-Process $binary -PassThru
          if (!$process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Fullscreen test timed out'
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path menu-test-failure.txt) { Get-Content menu-test-failure.txt }
            throw "Fullscreen test failed: $($process.ExitCode)"
          }
