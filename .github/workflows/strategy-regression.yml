name: Original strategy regression
on:
  pull_request:
    paths:
      - 'spellcross-map-edit-main/source/level.cpp'
      - 'spellcross-map-edit-main/source/level.h'
      - 'spellcross-map-edit-main/source/strategic_countdown_rules.h'
      - 'spellcross-map-edit-main/source/strategic_unit_timer_rules.h'
      - 'spellcross-map-edit-main/source/strategic_campaign_unlock_rules.h'
      - 'spellcross-map-edit-main/source/strategic_mission_flow.h'
      - 'spellcross-map-edit-main/source/app_version.h'
      - 'spellcross-map-edit-main/source/app_identity.h'
      - 'spellcross-map-edit-main/source/resources.rc'
      - 'spellcross-map-edit-main/source/release_version_compare.h'
      - 'spellcross-map-edit-main/source/forms/form_about.cpp'
      - 'spellcross-map-edit-main/source/main.cpp'
      - 'packaging/Build-CombinedRelease.ps1'
      - 'packaging/releases/**'
      - 'spellcross-map-edit-main/source/forms/form_level.cpp'
      - 'spellcross-map-edit-main/source/forms/form_level.h'
      - 'spellcross-map-edit-main/tests/**'
      - '.github/workflows/strategy-regression.yml'
  workflow_dispatch:

jobs:
  original-script-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and localization invariants
        run: python3 -m unittest discover -s spellcross-map-edit-main/tests -p 'test_*.py' -v
      - name: Compile and run the real LevelLoader against original script fixtures
        run: |
          c++ -std=c++17 -O0 -g -Wall -Wextra -pedantic \
            spellcross-map-edit-main/tests/test_original_level_events.cpp \
            spellcross-map-edit-main/source/level.cpp \
            -o /tmp/spellcross-level-event-regression
          /tmp/spellcross-level-event-regression
      - name: Compile and test retail territory countdown freeze
        run: |
          c++ -std=c++17 -O0 -g -Wall -Wextra -pedantic \
            spellcross-map-edit-main/tests/test_original_strategy_deadlines.cpp \
            -o /tmp/spellcross-strategy-deadline-regression
          /tmp/spellcross-strategy-deadline-regression
      - name: Compile and test original chapter 3 mission-stage lifecycle
        run: |
          c++ -std=c++17 -O0 -g -Wall -Wextra -pedantic \
            spellcross-map-edit-main/tests/test_original_strategy_mission_flow.cpp \
            -o /tmp/spellcross-original-mission-flow-test
          /tmp/spellcross-original-mission-flow-test
      - name: Compile and test campaign unit purchase unlock rules
        run: |
          c++ -std=c++17 -O0 -g -Wall -Wextra -pedantic \
            spellcross-map-edit-main/tests/test_campaign_unit_unlock.cpp \
            -o /tmp/spellcross-campaign-unit-unlock-test
          /tmp/spellcross-campaign-unit-unlock-test
      - name: Compile and test release version and RC ordering
        run: |
          c++ -std=c++17 -O0 -g -Wall -Wextra -pedantic \
            spellcross-map-edit-main/tests/test_release_version_compare.cpp \
            -o /tmp/spellcross-release-version-test
          /tmp/spellcross-release-version-test
      - name: Compile and test shared unit availability timer
        run: |
          c++ -std=c++17 -O0 -g -Wall -Wextra -pedantic \
            spellcross-map-edit-main/tests/test_unit_availability.cpp \
            -o /tmp/spellcross-unit-availability-test
          /tmp/spellcross-unit-availability-test
