name: Original strategy regression
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'spellcross-remaster-main/source/startup_log.h'
      - 'spellcross-remaster-main/source/spell_language.h'
      - 'spellcross-remaster-main/source/spellcross.cpp'
      - 'spellcross-remaster-main/source/spell_video.cpp'
      - 'spellcross-remaster-main/source/spell_video.h'
      - 'spellcross-remaster-main/source/can_video_decoder.h'
      - 'spellcross-remaster-main/source/menu_video_names.h'
      - 'spellcross-remaster-main/source/smacker_video_decoder.cpp'
      - 'spellcross-remaster-main/source/smacker_video_decoder.h'
      - 'spellcross-remaster-main/source/spellcross_map_editor.vcxproj'
      - 'third_party/libsmacker/**'
      - 'spellcross-remaster-main/source/forms/form_loader.cpp'
      - 'spellcross-remaster-main/source/forms/form_video_box.cpp'
      - 'spellcross-remaster-main/locales/**'
      - 'spellcross-remaster-main/source/level.cpp'
      - 'spellcross-remaster-main/source/level.h'
      - 'spellcross-remaster-main/source/strategic_countdown_rules.h'
      - 'spellcross-remaster-main/source/strategic_unit_timer_rules.h'
      - 'spellcross-remaster-main/source/unit_health_display.h'
      - 'spellcross-remaster-main/source/map.cpp'
      - 'spellcross-remaster-main/source/original_projectile_geometry.h'
      - 'spellcross-remaster-main/source/map.h'
      - 'spellcross-remaster-main/source/spell_units.cpp'
      - 'spellcross-remaster-main/source/strategic_campaign_unlock_rules.h'
      - 'spellcross-remaster-main/source/strategic_mission_flow.h'
      - 'spellcross-remaster-main/source/strategic_hierarchy_layout.h'
      - 'spellcross-remaster-main/source/strategic_random_attack_rules.h'
      - 'spellcross-remaster-main/source/strategic_battle_recovery_rules.h'
      - 'spellcross-remaster-main/source/strategic_commander_uid_rules.h'
      - 'spellcross-remaster-main/source/strategic_commander_experience_rules.h'
      - 'spellcross-remaster-main/source/tactical_background_action_rules.h'
      - 'spellcross-remaster-main/source/tactical_reaction_fire_rules.h'
      - 'spellcross-remaster-main/source/tactical_reaction_fire_mode.h'
      - 'spellcross-remaster-main/source/strategic_generated_spawn_rules.h'
      - 'spellcross-remaster-main/source/app_version.h'
      - 'spellcross-remaster-main/source/app_identity.h'
      - 'spellcross-remaster-main/source/resources.rc'
      - 'spellcross-remaster-main/source/release_version_compare.h'
      - 'spellcross-remaster-main/source/forms/form_about.cpp'
      - 'spellcross-remaster-main/source/main.cpp'
      - 'spellcross-remaster-main/source/game_autodeploy.h'
      - 'packaging/Build-CombinedRelease.ps1'
      - 'packaging/releases/**'
      - 'spellcross-remaster-main/source/forms/form_level.cpp'
      - 'spellcross-remaster-main/source/forms/form_level.h'
      - 'spellcross-remaster-main/tests/**'
      - '.github/workflows/strategy-regression.yml'
  workflow_dispatch:

jobs:
  original-script-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and localization invariants
        run: python3 -m unittest discover -s spellcross-remaster-main/tests -p 'test_*.py' -v
      - name: Verify recovered EN projectile geometry and FSA comparison switch
        run: |
          c++ -std=c++23 -O2 -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_original_projectile_geometry.cpp -o /tmp/spellcross-projectile-test
          env -u SPELLCROSS_PROJECTILE_MODEL /tmp/spellcross-projectile-test
          SPELLCROSS_PROJECTILE_MODEL=fsa /tmp/spellcross-projectile-test fsa
      - name: Compile and test native CAN decoding and retail finale playlist
        run: |
          c++ -std=c++23 -O2 -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/can_decoder_test.cpp -o /tmp/spellcross-can-test
          /tmp/spellcross-can-test
          c++ -std=c++23 -O2 -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/menu_video_names_test.cpp -o /tmp/spellcross-finale-test
          /tmp/spellcross-finale-test
      - name: Compile and test native Smacker movie decoding
        run: |
          cc -std=c11 -O2 -Wall -Wextra -pedantic -Ithird_party/libsmacker \
            -c third_party/libsmacker/smacker.c -o /tmp/libsmacker.o
          c++ -std=c++23 -O2 -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_smacker_decoder.cpp \
            spellcross-remaster-main/source/smacker_video_decoder.cpp \
            /tmp/libsmacker.o -o /tmp/spellcross-smacker-decoder-test
          /tmp/spellcross-smacker-decoder-test
      - name: Verify collision-free ground/air Autodeploy matching
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_autodeploy_rules.cpp \
            -o /tmp/spellcross-autodeploy-test
          /tmp/spellcross-autodeploy-test
      - name: Verify tactical mission-result frame stays visible (#178)
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_mission_debrief_layout.cpp \
            -o /tmp/spellcross-debrief-layout-test
          /tmp/spellcross-debrief-layout-test
      - name: Compile and run the real LevelLoader against original script fixtures
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_original_level_events.cpp \
            spellcross-remaster-main/source/level.cpp \
            -o /tmp/spellcross-level-event-regression
          /tmp/spellcross-level-event-regression
      - name: Compile and test original ordered chapter cinematic commands
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_level_video_playlist.cpp \
            spellcross-remaster-main/source/level.cpp \
            -o /tmp/spellcross-level-video-playlist-test
          /tmp/spellcross-level-video-playlist-test
      - name: Compile and test retail territory countdown freeze
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_original_strategy_deadlines.cpp \
            -o /tmp/spellcross-strategy-deadline-regression
          /tmp/spellcross-strategy-deadline-regression
      - name: Compile and test original chapter 3 mission-stage lifecycle
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_original_strategy_mission_flow.cpp \
            -o /tmp/spellcross-original-mission-flow-test
          /tmp/spellcross-original-mission-flow-test
      - name: Compile and test original random counterattack rules
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_random_counterattack_rules.cpp \
            -o /tmp/spellcross-random-counterattack-test
          /tmp/spellcross-random-counterattack-test
      - name: Compile and test retail research keys and formation bonuses
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_reported_issues_172_174.cpp \
            -o /tmp/spellcross-issues-172-174-test
          /tmp/spellcross-issues-172-174-test
      - name: Compile and test campaign unit purchase unlock rules
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_campaign_unit_unlock.cpp \
            -o /tmp/spellcross-campaign-unit-unlock-test
          /tmp/spellcross-campaign-unit-unlock-test
      - name: Compile and test release version and RC ordering
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_release_version_compare.cpp \
            -o /tmp/spellcross-release-version-test
          /tmp/spellcross-release-version-test
      - name: Compile and test shared unit availability timer
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_unit_availability.cpp \
            -o /tmp/spellcross-unit-availability-test
          /tmp/spellcross-unit-availability-test
      - name: Compile and test post-battle wounded recovery
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_battle_recovery_rules.cpp \
            -o /tmp/spellcross-battle-recovery-test
          /tmp/spellcross-battle-recovery-test
      - name: Compile and test tactical deselection and group action scheduler
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_tactical_background_action_rules.cpp \
            -o /tmp/spellcross-tactical-background-action-test
          /tmp/spellcross-tactical-background-action-test
      - name: Compile and test portable tactical save chapter recovery
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_portable_level_def_path.cpp \
            -o /tmp/spellcross-portable-chapter-test
          /tmp/spellcross-portable-chapter-test
      - name: Compile and test team-wide tactical reaction contact (#188)
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_tactical_reaction_fire_rules.cpp \
            -o /tmp/spellcross-tactical-reaction-sight-test
          /tmp/spellcross-tactical-reaction-sight-test
      - name: Compile and test Enhanced reaction-fire attempt rules
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_enhanced_reaction_fire_mode.cpp \
            -o /tmp/spellcross-enhanced-reaction-test
          /tmp/spellcross-enhanced-reaction-test
      - name: Compile and test retail-generated DTA enemy placements
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_strategic_generated_spawn_rules.cpp \
            -o /tmp/spellcross-generated-spawns-test
          /tmp/spellcross-generated-spawns-test
      - name: Compile and test stable commander identities
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_strategic_commander_uid_rules.cpp \
            -o /tmp/spellcross-commander-uids-test
          /tmp/spellcross-commander-uids-test
      - name: Compile and test original commander battles and promotions
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_strategic_commander_experience_rules.cpp \
            -o /tmp/spellcross-commander-experience-test
          /tmp/spellcross-commander-experience-test
      - name: Compile and test strategic hierarchy geometry
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_strategic_hierarchy_layout.cpp \
            -o /tmp/spellcross-hierarchy-layout-test
          /tmp/spellcross-hierarchy-layout-test
      - name: Compile and test single-member and multi-member health display
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic \
            spellcross-remaster-main/tests/test_unit_health_display.cpp \
            -o /tmp/spellcross-unit-health-display-test
          /tmp/spellcross-unit-health-display-test
      - name: Compile and test startup log durability and concurrency
        run: |
          c++ -std=c++23 -O0 -g -Wall -Wextra -pedantic -pthread \
            spellcross-remaster-main/tests/test_startup_log.cpp \
            -o /tmp/spellcross-startup-log-test
          /tmp/spellcross-startup-log-test "$(mktemp -d)"

